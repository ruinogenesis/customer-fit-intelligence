name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fitcore:
    name: fitcore (lint + test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fitcore/pyproject.toml

      - name: Install fitcore with dev tools
        run: python -m pip install -e "fitcore[dev]"

      - name: Lint
        run: ruff check fitcore

      - name: Test
        run: pytest fitcore

