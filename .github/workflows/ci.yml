name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fitcore:
    name: fitcore (lint + test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fitcore/pyproject.toml

      - name: Install fitcore with dev tools
        run: python -m pip install -e "fitcore[dev]"

      - name: Lint
        run: ruff check fitcore

      - name: Test
        run: pytest fitcore

  emulator:
    name: Firestore emulator round-trip
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fitcore/pyproject.toml

      - name: Set up Java (for the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node (for the Firebase CLI)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Install fitcore with dev tools
        run: python -m pip install -e "fitcore[dev]"

      - name: Round-trip test against the Firestore emulator
        run: firebase emulators:exec --only firestore --project demo-cfi "pytest fitcore/tests/test_round_trip.py -rs --junitxml=/tmp/round-trip.xml"

      - name: Fail if the round-trip test was skipped
        run: grep -q 'skipped="0"' /tmp/round-trip.xml
        

