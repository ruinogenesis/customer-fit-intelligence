name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fitcore:
    name: fitcore (lint + test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fitcore/pyproject.toml

      - name: Install CPU-only PyTorch
        # torch from PyPI on Linux pulls gigabytes of CUDA libraries; the
        # CPU-only build from PyTorch's own index is all the tests need.
        run: python -m pip install "torch>=2.14,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Install fitcore with dev and train tools
        run: python -m pip install -e "fitcore[dev,train]"

      - name: Show the torch version
        run: python -c "import torch; print(torch.__version__)"

      - name: Lint
        run: ruff check fitcore

      - name: Test
        run: pytest fitcore

  api:
    name: api (lint + test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fitcore/pyproject.toml
            api/pyproject.toml

      - name: Install fitcore and the API with dev tools
        # One command, so pip takes fitcore from this repo (it is not on
        # PyPI). No torch here: the API never installs it.
        run: python -m pip install -e fitcore -e "api[dev]"

      - name: Lint
        run: ruff check api

      - name: Test
        run: pytest api

  emulator:
    name: Firestore emulator round-trip
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            fitcore/pyproject.toml
            api/pyproject.toml

      - name: Set up Java (for the Firestore emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node (for the Firebase CLI)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Install fitcore and the API with dev tools
        run: python -m pip install -e "fitcore[dev]" -e "api[dev]"

      - name: Firestore and Auth tests against the emulators
        run: firebase emulators:exec --only firestore,auth --project demo-cfi "pytest fitcore/tests/test_round_trip.py api/tests/test_firestore_store.py api/tests/test_firestore_rules.py api/tests/test_roles.py api/tests/test_golden_api.py -rs --junitxml=/tmp/round-trip.xml"

      - name: Fail if any emulator test was skipped
        run: grep -q 'skipped="0"' /tmp/round-trip.xml

  dashboard:
    name: dashboard (test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check that the page's scripts parse
        run: node --check dashboard/public/main.js && node --check dashboard/public/matrix.js

      - name: Test
        # Node's own test runner: the dashboard has no npm packages yet.
        run: node --test dashboard/tests/*.test.js

  container:
    name: container (build + health)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the API image
        # The same Dockerfile and build context the deploy job builds (T208).
        run: docker build --tag cfi-api .

      - name: Start it as Cloud Run would
        # Cloud Run sets PORT. CI has no Firestore, so the in-memory store.
        run: docker run --detach --name api --publish 8080:8080 --env PORT=8080 --env CFI_STORE=memory cfi-api

      - name: Health answers, with the model from the image
        run: |
          for _ in $(seq 30); do
            curl --silent --fail http://127.0.0.1:8080/api/v1/health && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/api/v1/health | tee /tmp/health.json
          grep -q '"model_version":"t112-sim"' /tmp/health.json

      - name: An event is scored inside the container
        run: |
          curl --silent --fail --header "Content-Type: application/json" --data @- \
            http://127.0.0.1:8080/api/v1/events <<'JSON' | tee /tmp/event.json
          {"event_id": "00000000-0000-4000-8000-000000000001", "type": "order_placed",
           "customer_id": "ci", "occurred_at": "2026-01-01T12:00:00+00:00", "schema_version": 1,
           "payload": {"order_id": "ci-1", "restaurant_id": "r", "basket_value": 35000,
                       "fees": 4200, "promised_eta": "2026-01-01T12:30:00+00:00",
                       "promo_used": false}}
          JSON
          grep -q '"quadrant":"lovemark"' /tmp/event.json

      - name: Show the server's log
        if: always()
        run: docker logs api

  pre-commit:
    name: pre-commit (format, lint, types)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run every hook on every file
        # CI never commits, and a push to main runs on main itself, so the
        # guard against committing on main is skipped here.
        env:
          SKIP: no-commit-to-branch
        run: |
          python -m pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  deploy:
    name: deploy to dev
    # A merge: a push to main, and only after every check above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fitcore, api, emulator, dashboard, container, pre-commit]
    runs-on: ubuntu-latest
    # One deploy at a time, in merge order. A newer merge that is waiting
    # replaces an older one that is waiting; a running deploy is never cut off.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job get a GitHub OIDC token to show Google
    env:
      PROJECT: cfi-dev-th26
      REGION: asia-southeast3
      IMAGE: asia-southeast3-docker.pkg.dev/cfi-dev-th26/cfi/api:${{ github.sha }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the API image
        # Before signing in, so no credentials exist while the image builds.
        run: docker build --tag "$IMAGE" .

      - name: Sign in to Google Cloud as cfi-deployer, with no stored key
        # Workload Identity Federation: Google trades this run's GitHub token
        # for short-lived credentials (api/README.md).
        uses: google-github-actions/auth@v3
        with:
          project_id: cfi-dev-th26
          workload_identity_provider: projects/502930568433/locations/global/workloadIdentityPools/github/providers/cfi-repo
          service_account: cfi-deployer@cfi-dev-th26.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Push the image to Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast3-docker.pkg.dev --quiet
          docker push "$IMAGE"

      - name: Deploy the image to Cloud Run
        # Every setting of the service but public access, which is set once
        # by hand (api/README.md) and kept by every deploy.
        run: >-
          gcloud run deploy cfi-api --image "$IMAGE" --quiet
          --project "$PROJECT" --region "$REGION"
          --service-account cfi-api@cfi-dev-th26.iam.gserviceaccount.com
          --min-instances 0 --max-instances 2 --cpu 1 --memory 512Mi
          --set-env-vars "CFI_STORE=firestore,CFI_AUTH=firebase,CFI_PROJECT=$PROJECT"
          --set-secrets CFI_WRITE_KEY=cfi-write-key:latest

      - name: Set up Node (for the Firebase CLI)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy the page and the Firestore rules to Firebase
        run: |
          npm install -g firebase-tools@15
          firebase deploy --only hosting,firestore:rules --project "$PROJECT" --non-interactive --message "CI ${GITHUB_SHA::7}"

      - name: Dev serves this commit
        run: |
          gcloud run services describe cfi-api --project "$PROJECT" --region "$REGION" \
            --format 'value(spec.template.spec.containers[0].image)' | tee /tmp/image.txt
          grep -q "$GITHUB_SHA" /tmp/image.txt
          curl --silent --fail --retry 5 --retry-all-errors \
            https://cfi-dev-th26.web.app/api/v1/health | tee /tmp/health.json
          grep -q '"model_version":"t112-sim"' /tmp/health.json
          curl --silent --output /dev/null --write-out '%{http_code}\n' \
            --retry 5 --retry-all-errors --request POST \
            https://cfi-dev-th26.web.app/api/v1/score | tee /tmp/score.txt
          grep -qx 401 /tmp/score.txt
          curl --silent --output /dev/null --write-out '%{http_code}\n' \
            --retry 5 --retry-all-errors \
            "https://firestore.googleapis.com/v1/projects/$PROJECT/databases/(default)/documents/customers" \
            | tee /tmp/firestore.txt
          grep -qx 403 /tmp/firestore.txt
