# Checks that run automatically before every commit, and in CI.
# Update the pinned versions with: pre-commit autoupdate

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        name: mypy (fitcore)
        files: ^fitcore/src/
        args: [--config-file=fitcore/pyproject.toml]
        additional_dependencies: ["marshmallow>=4,<5", "numpy>=2,<3"]
      - id: mypy
        name: mypy (api)
        files: ^api/src/
        args: [--config-file=api/pyproject.toml]
        # fitcore itself comes from source (mypy_path in api/pyproject.toml),
        # so only its dependencies are listed here.
        additional_dependencies:
          - "flask>=3.1,<4"
          - "flask-smorest>=0.47,<0.48"
          - "google-cloud-bigquery>=3,<4"
          - "google-cloud-firestore>=2,<3"
          - "marshmallow>=4,<5"
          - "numpy>=2,<3"

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        # Checks the GitHub Actions workflows (T208). shellcheck-py brings
        # shellcheck along, so their run: scripts are checked on every
        # machine, not only where shellcheck happens to be installed.
        additional_dependencies: ["shellcheck-py==0.11.0.1"]
