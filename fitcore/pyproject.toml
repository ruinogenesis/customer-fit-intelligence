[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fitcore"
dynamic = ["version"]
description = "Shared feature and scoring logic for Customer Fit Intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["marshmallow>=4,<5", "numpy>=2,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.4",  # keep equal to the ruff rev in .pre-commit-config.yaml
    "google-cloud-firestore>=2,<3",
]
lab = ["ipykernel>=6", "pandas>=2", "matplotlib>=3.8", "semopy>=2.3,<3"]

[tool.hatch.version]
path = "src/fitcore/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
