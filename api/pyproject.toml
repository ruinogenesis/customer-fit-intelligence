[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfi-api"
dynamic = ["version"]
description = "The Customer Fit Intelligence API: events in, scores out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "flask-smorest>=0.47,<0.48", "marshmallow>=4,<5"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.4",  # keep equal to the ruff rev in .pre-commit-config.yaml
]

[tool.hatch.version]
path = "src/cfi_api/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

# flask-smorest ships no type hints, so mypy treats it as untyped.
[[tool.mypy.overrides]]
module = ["flask_smorest", "flask_smorest.*"]
ignore_missing_imports = true
