[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfi-api"
dynamic = ["version"]
description = "The Customer Fit Intelligence API: events in, scores out"
readme = "README.md"
requires-python = ">=3.12"
# fitcore is not on PyPI: always install it from this repo in the same pip
# command, e.g. pip install -e fitcore -e api, so pip never looks for it.
dependencies = [
    "fitcore",
    "firebase-admin>=7.8,<8",
    "flask>=3.1,<4",
    "flask-smorest>=0.47,<0.48",
    "google-cloud-firestore>=2,<3",
    "marshmallow>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.4",  # keep equal to the ruff rev in .pre-commit-config.yaml
]

[tool.hatch.version]
path = "src/cfi_api/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
# fitcore is read from source, so the mypy hook needs no copy of it.
mypy_path = "$MYPY_CONFIG_FILE_DIR/../fitcore/src"

# flask-smorest and firebase-admin ship no type hints, so mypy treats them
# as untyped.
[[tool.mypy.overrides]]
module = ["flask_smorest", "flask_smorest.*", "firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
