<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Both themes are the page's own (T409): browsers that darken pages
         themselves, such as Samsung Internet, are asked to leave it alone. -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="cfi-commit" content="%VITE_COMMIT%" />
    <title>Customer Fit Intelligence</title>
    <script>
      // The kept theme before the first paint (T409; see src/theme.ts).
      try {
        const kept = localStorage.getItem("cfi-theme");
        if (kept === "light" || kept === "dark") document.documentElement.dataset.theme = kept;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
